name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Code Quality & Linting
        run: npm run lint

      - name: Run Test Suite
        run: node --test tests/readiness.test.mjs tests/acwr.test.mjs
