<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0C1322" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <text x="600" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
    ATHLETECARE ENTERPRISE ARCHITECTURE &amp; BIOMETRIC PIPELINE
  </text>
  <text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">
    Full-Stack Next.js 15 App Router • Supabase Cloud PostgreSQL 15 • Gabbett ACWR &amp; 6-Pillar Readiness
  </text>

  <!-- LAYER 1: CLIENT PRESENTATION LAYER -->
  <g transform="translate(100, 140)">
    <rect width="1000" height="150" rx="16" fill="#0E1628" stroke="#1E293B" stroke-width="1.5" />
    <text x="30" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0EA5E9">CLIENT PRESENTATION &amp; WORKSPACES (NEXT.JS 15)</text>
    
    <g transform="translate(30, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#38BDF8" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Athlete Workspace</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Wellness, ACWR, Sleep, Diet</text>
    </g>

    <g transform="translate(270, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#3B82F6" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Coach Command</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Squad Readiness Board</text>
    </g>

    <g transform="translate(510, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#8B5CF6" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Medical Clinic</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Injury Cases &amp; Physio Prescriptions</text>
    </g>

    <g transform="translate(750, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#F59E0B" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Admin Console</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">RBAC, Telemetry &amp; Simulation</text>
    </g>
  </g>

  <!-- LAYER 2: EDGE APPLICATION ENGINE -->
  <g transform="translate(100, 340)">
    <rect width="1000" height="150" rx="16" fill="#0E1628" stroke="#1E293B" stroke-width="1.5" />
    <text x="30" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">EDGE COMPUTE &amp; BIOMETRIC CALCULATION ENGINE</text>

    <g transform="translate(30, 55)">
      <rect width="290" height="70" rx="10" fill="#131F38" stroke="#334155" stroke-width="1" />
      <text x="145" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">6-Pillar Readiness Score</text>
      <text x="145" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Weighted Sleep, Water, Soreness (0-100)</text>
    </g>

    <g transform="translate(350, 55)">
      <rect width="290" height="70" rx="10" fill="#131F38" stroke="#334155" stroke-width="1" />
      <text x="145" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Gabbett ACWR Model</text>
      <text x="145" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">7-Day Acute / 28-Day Chronic (0.8-1.3)</text>
    </g>

    <g transform="translate(670, 55)">
      <rect width="300" height="70" rx="10" fill="#131F38" stroke="#334155" stroke-width="1" />
      <text x="150" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Clinical Pain Alert Guard</text>
      <text x="150" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Pain &gt;= 7 (2+ Days) Auto-Flag to Medical</text>
    </g>
  </g>

  <!-- LAYER 3: DATABASE & RELATIONAL SECURITY -->
  <g transform="translate(100, 540)">
    <rect width="1000" height="150" rx="16" fill="#0E1628" stroke="#1E293B" stroke-width="1.5" />
    <text x="30" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">DATA &amp; SECURITY INFRASTRUCTURE (SUPABASE POSTGRESQL 15)</text>

    <g transform="translate(30, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#10B981" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Row Level Security</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Kernel-level RBAC isolation</text>
    </g>

    <g transform="translate(270, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#10B981" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Auto-Confirm Triggers</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">PostgreSQL event triggers</text>
    </g>

    <g transform="translate(510, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#10B981" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Immutable Audit Logs</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Full administrative event trail</text>
    </g>

    <g transform="translate(750, 55)">
      <rect width="210" height="70" rx="10" fill="#131F38" stroke="#10B981" stroke-width="1" />
      <text x="105" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Indian Standards</text>
      <text x="105" y="50" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">cm, kg, ml/L, Asia/Kolkata</text>
    </g>
  </g>
</svg>
