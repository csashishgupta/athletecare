<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="#070B14" />
  
  <!-- Grid Matrix Overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="800" height="1000" fill="url(#grid)" />

  <text x="400" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
    ATHLETECARE MUSCULOSKELETAL BIOMETRIC MAP
  </text>
  <text x="400" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">
    Standard Anatomical Assessment • Anterior &amp; Posterior Compartments
  </text>

  <!-- ANTERIOR COMPARTMENT (LEFT) -->
  <g id="anterior-view" transform="translate(50, 80)">
    <text x="150" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0EA5E9" text-anchor="middle">ANTERIOR (FRONT)</text>

    <!-- Head & Neck -->
    <path d="M 120 70 C 120 40 180 40 180 70 C 180 100 120 100 120 70 Z" fill="url(#bodyGrad)" stroke="#334155" stroke-width="2" />
    <path d="M 135 95 L 135 125 L 165 125 L 165 95 Z" fill="url(#bodyGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Trapezius & Deltoids -->
    <path id="left-deltoid" d="M 100 135 C 80 145 75 180 95 195 C 105 180 115 150 110 135 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />
    <path id="right-deltoid" d="M 200 135 C 220 145 225 180 205 195 C 195 180 185 150 190 135 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />

    <!-- Pectoralis Major -->
    <path id="left-pec" d="M 115 135 C 145 135 150 160 148 185 C 120 185 105 160 115 135 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />
    <path id="right-pec" d="M 185 135 C 155 135 150 160 152 185 C 180 185 195 160 185 135 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />

    <!-- Rectus Abdominis (Core) -->
    <g id="abdominals">
      <rect x="135" y="195" width="13" height="20" rx="3" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1" />
      <rect x="152" y="195" width="13" height="20" rx="3" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1" />
      <rect x="135" y="220" width="13" height="20" rx="3" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1" />
      <rect x="152" y="220" width="13" height="20" rx="3" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1" />
      <rect x="135" y="245" width="13" height="22" rx="3" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1" />
      <rect x="152" y="245" width="13" height="22" rx="3" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1" />
    </g>

    <!-- Quadriceps (Rectus Femoris & Vastus Lateralis/Medialis) -->
    <path id="left-quad" d="M 110 300 C 105 350 115 420 128 440 C 142 420 148 350 145 300 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />
    <path id="right-quad" d="M 190 300 C 195 350 185 420 172 440 C 158 420 152 350 155 300 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />

    <!-- Tibialis Anterior (Calves/Shin Front) -->
    <path id="left-shin" d="M 120 460 C 115 520 120 570 125 580 C 132 570 135 520 132 460 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />
    <path id="right-shin" d="M 180 460 C 185 520 180 570 175 580 C 168 570 165 520 168 460 Z" fill="url(#muscleGrad)" stroke="#0EA5E9" stroke-width="1.5" />
  </g>

  <!-- POSTERIOR COMPARTMENT (RIGHT) -->
  <g id="posterior-view" transform="translate(450, 80)">
    <text x="150" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#818CF8" text-anchor="middle">POSTERIOR (BACK)</text>

    <!-- Head & Neck -->
    <path d="M 120 70 C 120 40 180 40 180 70 C 180 100 120 100 120 70 Z" fill="url(#bodyGrad)" stroke="#334155" stroke-width="2" />

    <!-- Trapezius & Upper Back -->
    <path id="traps" d="M 150 100 L 115 135 C 130 150 150 170 150 200 C 150 170 170 150 185 135 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />

    <!-- Latissimus Dorsi -->
    <path id="left-lat" d="M 115 160 C 100 200 120 250 145 260 L 145 190 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />
    <path id="right-lat" d="M 185 160 C 200 200 180 250 155 260 L 155 190 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />

    <!-- Gluteus Maximus -->
    <path id="left-glute" d="M 110 280 C 105 320 140 335 148 315 L 148 280 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />
    <path id="right-glute" d="M 190 280 C 195 320 160 335 152 315 L 152 280 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />

    <!-- Hamstrings (Biceps Femoris & Semitendinosus) -->
    <path id="left-hamstring" d="M 115 330 C 110 390 120 440 130 445 C 142 440 145 390 145 330 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" filter="url(#glow)" />
    <path id="right-hamstring" d="M 185 330 C 190 390 180 440 170 445 C 158 440 155 390 155 330 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />

    <!-- Gastrocnemius & Soleus (Calves) -->
    <path id="left-calf" d="M 118 460 C 110 500 115 540 126 565 C 135 540 138 500 132 460 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />
    <path id="right-calf" d="M 182 460 C 190 500 185 540 174 565 C 165 540 162 500 168 460 Z" fill="url(#highlightGrad)" stroke="#818CF8" stroke-width="1.5" />
  </g>

  <!-- Technical Legend Footer -->
  <g transform="translate(150, 750)">
    <rect x="0" y="0" width="500" height="90" rx="12" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
    <circle cx="40" cy="45" r="8" fill="#0EA5E9" />
    <text x="60" y="50" font-family="sans-serif" font-size="12" fill="#E2E8F0">Anterior Target Muscle Chains</text>
    
    <circle cx="280" cy="45" r="8" fill="#818CF8" />
    <text x="300" y="50" font-family="sans-serif" font-size="12" fill="#E2E8F0">Posterior Target Muscle Chains</text>
  </g>
</svg>
